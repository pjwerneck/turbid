name: Build and Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Test, build and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # enable OIDC for trusted publishing
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Verify wheel is universal (py3-none-any)
        run: |
          WHEEL=$(ls dist/*.whl | head -n1)
          echo "Built wheel: $WHEEL"
          case "$WHEEL" in
            *py3-none-any.whl) echo "OK: universal wheel tag";;
            *) echo "ERROR: wheel is not universal (py3-none-any)."; exit 1;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Publish to PyPI (token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

