name: Build and Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Build sdist and wheel
        run: uv build

      - name: Verify wheel is universal (py3-none-any)
        run: |
          WHEEL=$(ls dist/*.whl | head -n1)
          echo "Built wheel: $WHEEL"
          case "$WHEEL" in
            *py3-none-any.whl) echo "OK: universal wheel tag";;
            *) echo "ERROR: wheel is not universal (py3-none-any)."; exit 1;;
          esac


  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Publish to PyPI (token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
